# Build and publish signed release APK and AAB to GitHub Releases.
# Triggered on tag push (v*) or manually via workflow_dispatch.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 ndk;27.2.12479018

      - name: Test and build the zhuyin lexicon
        run: |
          cargo test --manifest-path engine/fs_lexicon/Cargo.toml
          bash tools/build-lexicon.sh

      - uses: gradle/actions/setup-gradle@v6

      - name: Build Signed Release APK & Bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            export KEYSTORE_FILE=/tmp/release.keystore
          else
            echo "::warning ::KEYSTORE_BASE64 secret not set! Release build will fall back to debug signing."
          fi

          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            VERSION_NAME="${{ inputs.tag_name }}"
            VERSION_NAME="${VERSION_NAME#v}"
          fi

          ./gradlew :app:assembleRelease :app:bundleRelease -PversionName="$VERSION_NAME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          fi

          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FsKeyboard-${TAG}.apk"
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab "dist/FsKeyboard-${TAG}.aab"
          fi

          gh release create "$TAG" dist/* \
            --title "FsKeyboard $TAG" \
            --generate-notes
