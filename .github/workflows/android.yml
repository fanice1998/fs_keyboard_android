# Debug APK and unit tests.
# The runner builds the Rust zhuyin lexicon. libfs_lexicon.so is not in git.
# gradle.properties keeps rime.enabled=false, and this job does not pass it.
# model.onnx is still absent. The APK is unsigned debug.
name: android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 ndk;27.2.12479018

      - name: Test and build the zhuyin lexicon
        run: |
          cargo test --manifest-path engine/fs_lexicon/Cargo.toml
          bash tools/build-lexicon.sh

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
